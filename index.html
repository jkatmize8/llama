<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BeachesA1A Pin Studio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='0.35' y2='1'><stop offset='0' stop-color='%232B8FAB'/><stop offset='1' stop-color='%236DD4EC'/></linearGradient></defs><circle cx='50' cy='50' r='46' fill='url(%23g)'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,700&family=DM+Sans:wght@300;400;500;600;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <p class="eyebrow">BeachesA1A</p>
    <div class="logo">Pin Studio</div>
    <p class="tagline">Two to four Pinterest image assets from one idea, ready to download</p>
  </header>

  <main class="layout">
    <aside class="controls">
      <section class="control-group">
        <h2>Content</h2>
        <label for="title">Pin title</label>
        <textarea id="title" rows="2" maxlength="80" placeholder="Bring the Coast Home">Bring the Coast Home</textarea>

        <label for="subtitle">Subtitle / hook</label>
        <input id="subtitle" type="text" maxlength="90" value="Wake up to the golden glow of Neptune Beach — ready to download" placeholder="A short supporting line" />

        <label for="brand">Brand / website</label>
        <input id="brand" type="text" maxlength="40" value="BeachesA1A" placeholder="yourblog.com" />

        <label for="cta">Call to action (optional)</label>
        <input id="cta" type="text" maxlength="30" value="Shop Prints" placeholder="Read More" />
      </section>

      <section class="control-group">
        <h2>Style</h2>
        <label for="styleset">Template set</label>
        <select id="styleset">
          <option value="photo" selected>Photo layouts — built around an image</option>
          <option value="text">Text graphics — no photo needed</option>
        </select>

        <label for="palette">Color palette</label>
        <select id="palette"></select>

        <label for="size">Pin size</label>
        <select id="size">
          <option value="standard" selected>Standard Pin — 1000 × 1500 (2:3)</option>
          <option value="square">Square Pin — 1000 × 1000 (1:1)</option>
          <option value="tall">Idea / Story Pin — 1080 × 1920 (9:16)</option>
        </select>

        <label for="count">Number of assets</label>
        <select id="count">
          <option value="2">2 assets</option>
          <option value="3">3 assets</option>
          <option value="4" selected>4 assets</option>
        </select>

        <label for="photo">Photo (used by the photo templates; a neutral tile fills in if empty)</label>
        <input id="photo" type="file" accept="image/*" />
      </section>

      <button id="generate" class="btn primary">Generate assets</button>
      <button id="download-all" class="btn secondary" disabled>Download all</button>
    </aside>

    <section class="gallery-wrap">
      <div id="gallery" class="gallery">
        <p class="empty-hint">Fill in your content and click <strong>Generate assets</strong>.</p>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    All rendering happens in your browser — nothing is uploaded anywhere.
  </footer>

  <script src="js/templates.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
